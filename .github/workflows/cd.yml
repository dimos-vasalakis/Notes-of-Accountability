name: CD

# Requires the REGISTRY, REGISTRY_USERNAME, REGISTRY_PASSWORD secrets to be
# set in the repo settings.
on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
            target: prod
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            target: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          # ghcr.io requires an owner segment in the repo path
          # (ghcr.io/<owner>/<image>), separate from the bare hostname used
          # to log in above. A REGISTRY secret set to just "ghcr.io" (no
          # owner) produced an owner-less push path, which ghcr.io's backend
          # rejected with a malformed 400 on the blob HEAD check instead of
          # a clean error.
          tags: ${{ secrets.REGISTRY }}/${{ github.repository_owner }}/noa-${{ matrix.image }}:${{ github.sha }},${{ secrets.REGISTRY }}/${{ github.repository_owner }}/noa-${{ matrix.image }}:latest
          # Scoped per image: the default scope is shared across the whole
          # matrix (keyed by git ref, not matrix value), so backend and
          # frontend would otherwise share one cache entry.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=min
          # Some registries reject buildx's default provenance/SBOM
          # attestation blobs; disable them defensively.
          provenance: false
          sbom: false
