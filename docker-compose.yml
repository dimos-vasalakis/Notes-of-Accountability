services:
  db:
    image: postgres:15
    container_name: noa-db-dev
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    container_name: noa-backend-dev
    restart: unless-stopped
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: noa-frontend-dev
    restart: unless-stopped
    env_file: frontend/.env.local
    depends_on:
      - backend
    volumes:
      - ./frontend/app:/app/app
      - /app/node_modules
    ports:
      - "3000:3000"

volumes:
  pgdata:
