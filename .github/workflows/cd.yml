name: CD

# Disabled for now: manual trigger only. Once ready to enable, uncomment the
# push trigger below and set the registry secrets (REGISTRY, REGISTRY_USERNAME,
# REGISTRY_PASSWORD) in the repo settings.
on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
            target: prod
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            target: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ secrets.REGISTRY }}/noa-${{ matrix.image }}:${{ github.sha }},${{ secrets.REGISTRY }}/noa-${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
