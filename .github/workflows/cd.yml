name: CD

# Requires the REGISTRY, REGISTRY_USERNAME, REGISTRY_PASSWORD secrets to be
# set in the repo settings.
on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
            target: prod
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            target: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ secrets.REGISTRY }}/noa-${{ matrix.image }}:${{ github.sha }},${{ secrets.REGISTRY }}/noa-${{ matrix.image }}:latest
          # Scoped per image: the default scope is shared across the whole
          # matrix (keyed by git ref, not matrix value), so backend and
          # frontend were clobbering each other's cache entries mid-run.
          cache-from: type=gha,scope=${{ matrix.image }}
          # mode=min (not max): ghcr.io intermittently 400s the blob HEAD
          # check for cached intermediate-stage layers that mode=max
          # uploads; min only caches the final stage we actually push.
          cache-to: type=gha,scope=${{ matrix.image }},mode=min
          # Some registries 400 on the HEAD request for buildx's default
          # provenance/SBOM attestation blobs; disable them.
          provenance: false
          sbom: false
